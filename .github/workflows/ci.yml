name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail on any warning, so a doc or build warning is a red build.
  RUSTFLAGS: -D warnings

jobs:
  # Formatting is checked with nightly rustfmt, because rustfmt.toml uses nightly-only options
  # (group_imports, imports_granularity). It is the only step that needs nightly.
  fmt:
    name: rustfmt (nightly)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt
    - run: cargo +nightly fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # The pinned toolchain from rust-toolchain.toml (1.97.1) with clippy.
    - uses: dtolnay/rust-toolchain@1.97.1
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: clippy (default features)
      run: cargo clippy --workspace --all-targets -- -D warnings
    # The CLI forwards these features to the library it consumes, so the named package enables both.
    - name: clippy (s3 feature)
      run: cargo clippy --workspace --all-targets --features xget-cli/s3 -- -D warnings
    - name: clippy (ipfs feature)
      run: cargo clippy --workspace --all-targets --features xget-cli/ipfs -- -D warnings
    - name: clippy (all features)
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.97.1
    - uses: Swatinem/rust-cache@v2
    - name: test (default features, all targets + doctests)
      run: cargo test --workspace --all-targets && cargo test -p xget --doc
    # The s3 code paths compile and their tests run without any live AWS. Build and test them so the
    # feature does not rot; the integration tests here use a fake Source and an in-process mock server,
    # never a live network. The CLI forwards the feature, so naming it there enables the library too.
    - name: test (s3 feature)
      run: cargo test --workspace --all-targets --features xget-cli/s3
    # The ipfs source resolves a CID to a gateway HTTP request; its unit tests parse CIDs and derive the
    # verifiable checksum with no network. All features together must also build and test cleanly.
    - name: test (ipfs feature)
      run: cargo test --workspace --all-targets --features xget-cli/ipfs
    - name: test (all features)
      run: cargo test --workspace --all-targets --all-features && cargo test -p xget --doc --all-features

  # Check both packages on Windows with the MSVC toolchain required by the TLS backend. Unix filesystem
  # operations are cfg-gated; this checks fallback compilation, not native publication on Windows.
  windows:
    name: windows check
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.97.1
    - uses: Swatinem/rust-cache@v2
    - run: cargo check --workspace --all-targets --all-features

# Note: the docker harness under scripts/harness/ (go-httpbin + minio + toxiproxy) is a manual dev tool for
# fault-injection and real-object-store testing. It needs containers and is intentionally not run in
# CI; the Rust integration tests above cover the engine and HttpSource without any of that.
