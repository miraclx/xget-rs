[package]
name = "xget"
version = "0.1.0"
authors = ["Miraculous Owonubi <omiraculous@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "A chunked, parallel, resumable, verified fetch engine over a pluggable byte source"
repository = "https://github.com/miraclx/xget-rs"
license = "MIT OR Apache-2.0"
keywords = ["download", "http", "range", "resume", "parallel"]
categories = ["network-programming", "asynchronous"]

[features]
s3 = ["dep:aws-config", "dep:aws-credential-types", "dep:aws-sdk-s3", "dep:aws-smithy-types", "dep:tokio-util"]
ipfs = ["dep:cid"]
aws-credential-types = ["dep:aws-credential-types"]
aws-smithy-types = ["dep:aws-smithy-types"]

[dependencies]
anstyle = "1"
aws-config = { version = "1.8", optional = true }
aws-credential-types = { version = "1.2.10", optional = true }
aws-sdk-s3 = { version = "1.96", optional = true }
aws-smithy-types = { version = "1.3.4", optional = true }
blake3 = "1.8.7"
bytes = "1"
cid = { version = "0.11", optional = true }
clap = { version = "4", features = ["derive"] }
digest = "0.10"
dotenvy = "0.15.7"
eyre = "0.6"
futures = "0.3"
hex = "0.4"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", optional = true, features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter"] }

# Sibling crates from the same rewrite effort. Git dependencies so the crate builds standalone (and in
# CI); a gitignored .cargo/config.toml overrides these with the neighbouring working copies for local
# co-development, so edits across the three repos are picked up without a push.
xbytes = { git = "https://github.com/miraclx/xbytes-rs" }
xprogress = { git = "https://github.com/miraclx/xprogress-rs" }

# Only for the startup sweep of orphaned temp scratches: a process-liveness check so a partial left by a
# since-dead process is cleaned up while a live download's scratch is never touched. Unix uses
# `kill(pid, 0)`; Windows uses `OpenProcess`. These target sections must come after all [dependencies]
# entries above, or a following key would be parsed into the target table instead of [dependencies].
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
# An in-process mock HTTP server for the HttpSource integration tests: it lets a test answer a range
# request with a real 206 and Content-Range (or deliberately ignore the range) so the source's own
# validation is exercised over a real loopback socket, with no live network. The engine's own paths
# are covered by a fake Source and need no server.
wiremock = "0.6"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"
