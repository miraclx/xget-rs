[package]
name = "libxget"
version = "0.1.0"
authors = ["Miraculous Owonubi <omiraculous@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "A chunked, parallel, resumable, verified fetch engine over a pluggable byte source"
repository = "https://github.com/miraclx/libxget-rs"
license = "MIT OR Apache-2.0"
keywords = ["download", "http", "range", "resume", "parallel"]
categories = ["network-programming", "asynchronous"]

[dependencies]
bytes = "1"
futures = "0.3"
thiserror = "2"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"
