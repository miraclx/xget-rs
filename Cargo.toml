[package]
name = "libxget"
version = "0.1.0"
authors = ["Miraculous Owonubi <omiraculous@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "A chunked, parallel, resumable, verified fetch engine over a pluggable byte source"
repository = "https://github.com/miraclx/libxget-rs"
license = "MIT OR Apache-2.0"
keywords = ["download", "http", "range", "resume", "parallel"]
categories = ["network-programming", "asynchronous"]

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"
