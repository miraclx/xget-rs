name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail on any warning, so a doc or build warning is a red build.
  RUSTFLAGS: -D warnings

jobs:
  # Formatting is checked with nightly rustfmt, because rustfmt.toml uses nightly-only options
  # (group_imports, imports_granularity). It is the only step that needs nightly.
  fmt:
    name: rustfmt (nightly)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt
    - run: cargo +nightly fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # The pinned toolchain from rust-toolchain.toml (1.97.1) with clippy.
    - uses: dtolnay/rust-toolchain@1.97.1
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: clippy (default features)
      run: cargo clippy --all-targets -- -D warnings
    - name: clippy (s3 feature)
      run: cargo clippy --all-targets --features s3 -- -D warnings
    - name: clippy (ipfs feature)
      run: cargo clippy --all-targets --features ipfs -- -D warnings
    - name: clippy (all features)
      run: cargo clippy --all-targets --features "s3 ipfs" -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.97.1
    - uses: Swatinem/rust-cache@v2
    - name: test (default features, all targets + doctests)
      run: cargo test --all-targets && cargo test --doc
    # The s3 code paths compile and their tests run without any live AWS. Build and test them so the
    # feature does not rot; the integration tests here use a fake Source and an in-process mock server,
    # never a live network.
    - name: test (s3 feature)
      run: cargo test --all-targets --features s3
    # The ipfs source resolves a CID to a gateway HTTP request; its unit tests parse CIDs and derive the
    # verifiable checksum with no network. All features together must also build and test cleanly.
    - name: test (ipfs feature)
      run: cargo test --all-targets --features ipfs
    - name: test (all features)
      run: cargo test --all-targets --features "s3 ipfs" && cargo test --doc --features "s3 ipfs"

  # Prove the crate and the binary compile on Windows too. A Windows runner has the MSVC toolchain the
  # TLS backend's native crypto needs, so this catches any non-portable code (the one unix-only path,
  # special-file detection, is cfg-gated and falls back on other platforms).
  windows:
    name: windows check
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.97.1
    - uses: Swatinem/rust-cache@v2
    - run: cargo check --all-targets --features "s3 ipfs"

# Note: the docker harness under harness/ (go-httpbin + minio + toxiproxy) is a manual dev tool for
# fault-injection and real-object-store testing. It needs containers and is intentionally not run in
# CI; the Rust integration tests above cover the engine and HttpSource without any of that.
