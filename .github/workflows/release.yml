name: RC artifacts (nonpublishing)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - 'release/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/**'
      - 'cli/**'
      - 'tests/**'
      - 'LICENSE-*'
      - 'README.md'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'release/**'
  workflow_dispatch:

# This workflow only reads source/CI and stores expiring Actions artifacts. It never publishes.
permissions:
  contents: read
  actions: read

concurrency:
  group: rc-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  helpers:
    name: candidate helper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -I -B -m unittest discover -s release -p '*_tests.py' -v

  build:
    needs: helpers
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: candidate ${{ matrix.target }}
    timeout-minutes: 90
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm}
          - {target: x86_64-apple-darwin, runner: macos-15-intel}
          - {target: aarch64-apple-darwin, runner: macos-15}
    env:
      CANDIDATE_RUNNER: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - name: Isolate candidate Cargo directories after toolchain setup
        shell: bash
        run: |
          printf 'CARGO_HOME=%s/candidate-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/candidate-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Helper tests
        run: python3 -I -B -m unittest discover -s release -p '*_tests.py' -v
      - name: Build, package and smoke extracted final bytes
        run: python3 -I -B release/artifact.py build --target '${{ matrix.target }}' --output '${{ runner.temp }}/candidate-output'
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/candidate-output/*
          if-no-files-found: error
          retention-days: 14

  accept:
    name: accept complete candidate set
    needs: build
    timeout-minutes: 100
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/candidate-input
          merge-multiple: false
      - name: Require successful CI for this exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B release/ci_gate.py --output '${{ runner.temp }}/ci.json' --deadline-seconds 5400
      - name: Validate all four archives and receipts, assemble provenance and checksums
        run: python3 -I -B release/artifact.py aggregate --input '${{ runner.temp }}/candidate-input' --ci '${{ runner.temp }}/ci.json' --output '${{ runner.temp }}/accepted-candidate'
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-rc-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/accepted-candidate/*
          if-no-files-found: error
          retention-days: 14
